name: SEO regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  seo-regression:
    name: SEO regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:seo
